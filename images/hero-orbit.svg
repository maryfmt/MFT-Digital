<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" role="img" aria-labelledby="title">
  <title id="title">Monograma MFT em círculos laranja e vermelho</title>
  <defs>
    <radialGradient id="glow"><stop stop-color="#C45306" stop-opacity=".48"/><stop offset="1" stop-color="#330A05" stop-opacity="0"/></radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#C45306"/><stop offset=".52" stop-color="#761305"/><stop offset="1" stop-color="#9D3306"/></linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#9D3306"/><stop offset="1" stop-color="#550F05"/></linearGradient>
  </defs>
  <circle cx="307" cy="245" r="244" fill="url(#glow)"/>
  <circle cx="300" cy="245" r="210" fill="none" stroke="#9D3306" stroke-width="1" opacity=".5"/>
  <circle cx="300" cy="245" r="178" fill="none" stroke="url(#ring)" stroke-width="2" opacity=".85"/>
  <circle cx="300" cy="245" r="151" fill="none" stroke="#C45306" stroke-width="2" opacity=".8"/>
  <circle cx="300" cy="245" r="126" fill="url(#disc)" stroke="#C45306" stroke-width="1.5"/>
  <circle cx="300" cy="245" r="108" fill="none" stroke="#E46D17" stroke-width="1" opacity=".65"/>
  <text x="300" y="250" fill="#FFF4EA" text-anchor="middle" font-family="Arial,sans-serif" font-size="60" font-weight="800" letter-spacing="-5">MFT</text>
  <text x="300" y="280" fill="#F2A35E" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="7">DIGITAL</text>
  <g fill="#F2A35E" font-family="Arial,sans-serif" font-size="10" letter-spacing="2">
    <text x="482" y="276">IDEIAS</text><text x="482" y="294">MARCAS</text><text x="482" y="312">SITES</text>
  </g>
  <path d="M481 326h62" stroke="#C45306" stroke-width="2"/>
